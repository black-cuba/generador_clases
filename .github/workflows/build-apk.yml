name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web bundles
        run: npm run build:web

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build APK (release)
        working-directory: android
        env:
          VERSION_NAME: "1.0.${{ github.run_number }}"
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename $APK_PATH)" >> "$GITHUB_OUTPUT"

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Generador de Clases v1.0.${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            APK instalable (release): copiar el archivo .apk al teléfono e instalar.
            - Compatir abre WhatsApp con el .docx adjunto (si no hay WhatsApp, no hace nada).
            - Guardar escribe el .docx directo en la carpeta Descargas.
            - Pegar el texto de las planificaciones → detecta cada clase y genera un Word (.docx) por clase.
            - Incluye formato de fórmulas químicas (subíndices/superíndices, p. ej. H2O, Fe2+, SO4(2-)).