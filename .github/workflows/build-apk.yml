name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar bundles web
        run: npm run build:web

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Crear Keystore de Firma Release
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias generadordeclases \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass generador2026 \
            -keypass generador2026 \
            -dname "CN=Miguel Angel Pineiro, OU=Educacion, O=Generador de Clases, L=La Habana, C=CU"

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Compilar APK Release Listo para Instalar
        working-directory: android
        env:
          VERSION_NAME: "1.0.${{ github.run_number }}"
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: "generador2026"
          KEY_ALIAS: "generadordeclases"
          KEY_PASSWORD: "generador2026"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Preparar archivo APK final
        id: apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No se encontró el archivo APK generado."
            exit 1
          fi
          mkdir -p dist-apk
          FINAL_NAME="generador_de_clases.apk"
          cp "$APK_FILE" "dist-apk/$FINAL_NAME"
          echo "path=dist-apk/$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "filename=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "APK listo en: dist-apk/$FINAL_NAME"

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: generador_de_clases
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Generador de Clases v1.0.${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          body: |
            ### 📱 Generador de Clases - APK Release
            - **Archivo:** `generador_de_clases.apk`
            - **Autor:** Miguel Angel Piñeiro
            - **Versión:** `v1.0.${{ github.run_number }}`
            - **Tipo:** APK Release Oficial (firmada, lista para instalar en celular)
            
            #### Instalación:
            1. Descargue `generador_de_clases.apk` en su teléfono.
            2. Toque el archivo para instalar.
