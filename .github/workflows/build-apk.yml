name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar bundles web
        run: npm run build:web

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Compilar APK (Release)
        working-directory: android
        env:
          VERSION_NAME: "1.0.${{ github.run_number }}"
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Localizar y preparar APK
        id: apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No se encontró el APK generado."
            exit 1
          fi
          mkdir -p dist-apk
          FINAL_NAME="GeneradorClases-v1.0.${{ github.run_number }}.apk"
          cp "$APK_FILE" "dist-apk/$FINAL_NAME"
          echo "path=dist-apk/$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "filename=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "APK preparado en: dist-apk/$FINAL_NAME"

      - name: Subir APK como Artefacto (Descarga directa en Actions)
        uses: actions/upload-artifact@v4
        with:
          name: GeneradorClases-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Generador de Clases v1.0.${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          body: |
            ### 📱 Generador de Clases - APK para Android
            - **Archivo:** `${{ steps.apk.outputs.filename }}`
            - **Autor:** Miguel Angel Piñeiro
            - **Versión:** `v1.0.${{ github.run_number }}`
            
            #### Instrucciones de instalación:
            1. Descargue el archivo `.apk` a su teléfono Android.
            2. Toque el archivo descargado para instalarlo (permita instalar aplicaciones de fuentes desconocidas si se lo solicita el sistema).
            3. ¡Listo para usar sin conexión!
